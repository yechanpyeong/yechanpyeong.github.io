    Experience:
      - company: "KAIST (Advisor: Prof. Young Min Rhee)"
        position: Semiclassical nonadiabatic dynamics and electronic coherence in photochemical reactions
        location: Daejeon, Republic of Korea
        start_date: 2025-12
        end_date: present
        highlights:
          - Analyzed mixed quantum-classical (pbme-nH) trajectories to determine the role of electronic coherence in furan photochemistry.
          - Investigated how phase-coherent electronic dynamics influence branching ratios at conical intersections during ring-opening reactions.
          - Integrating Spin Mapping into the pbme-nH framework to replace MMST mapping, aiming to improve the physical accuracy of semiclassical simulations.
          - Studied advanced theoretical frameworks, including AIMS, FSSH, and Basin-hopping algorithms, for potential energy surface exploration.

      - company: "KAIST (Advisor: Prof. Woo Youn Kim)"
        position: Automated bond perception and atom mapping via mixed-integer linear programming
        location: Daejeon, Republic of Korea
        start_date: 2023-06
        end_date: 2023-11
        highlights:
          - Developed core modules for the acerxn program to predict reaction networks and determine bond orders from 3D atomic connectivity.
          - Formulated the Atom Connection to Bond Order (ACtoBO) problem as a MILP model to restore bond orders and formal charges from Cartesian coordinates.
          - Optimized multiple objective functions with Gurobi and SciPy, successfully resolving resonance and charge polarization errors.
          - Achieved >99% bond order restoration accuracy by benchmarking against thousands of complex organic molecules from PubChem.

    Leadership & Extracurricular Experience:
      - bullet: "**Principal Double Bassist**, KAIST Orchestra, Daejeon (Mar 2023 – Present). Perform as a dedicated double bassist for regular symphonic concerts and serve as the Section Leader (from Jan 2026) to direct rehearsals and mentor section members."

      - bullet: "**Prescribed Load List (PLL) Specialist / KATUSA**, Eighth U.S. Army, Republic of Korea (Jan 2024 – Jul 2025). Managed logistical support for a U.S. Army combat regiment while facilitating cross-cultural communication and operational coordination during major US-ROK joint military exercises."

